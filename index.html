<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      Funngro | Real-World Projects & Opportunities for Young Talent
    </title>

    <meta
      name="description"
      content="Funngro connects young talent with real-world projects, student opportunities, skill-building experiences and companies looking for fresh talent."
    />

    <meta
      name="keywords"
      content="Funngro, teen jobs, student opportunities, young talent, student freelancers, freelance projects for students, real-world projects, skill development, company projects, youth opportunities, work experience for students"
    />

    <meta
      name="author"
      content="Funngro Evaluation Project"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="language"
      content="English"
    />

    <!-- Canonical -->
    <!-- Update this URL after deploying the website -->
    <link
      rel="canonical"
      href="https://your-deployed-domain.com/"
    />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="Funngro | Real-World Projects for Young Talent"
    />

    <meta
      property="og:description"
      content="Discover real-world projects, build valuable skills and gain practical experience through opportunities designed for young talent."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://your-deployed-domain.com/"
    />

    <meta
      property="og:site_name"
      content="Funngro"
    />

    <!-- Twitter / Social Preview -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Funngro | Real-World Projects for Young Talent"
    />

    <meta
      name="twitter:description"
      content="Build skills, gain experience and discover real-world project opportunities with Funngro."
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#ff5c35"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      href="/favicon.ico"
    />

  </head>

  <body>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>

  </body>
</html>
